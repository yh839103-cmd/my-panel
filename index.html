<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Panel - 個人生活儀表板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .panel-container {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      padding: 35px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 8px;
    }
    .clock {
      font-size: 1.6rem;
      font-weight: 600;
      color: #3498db;
      margin-bottom: 6px;
    }
    .date-str {
      color: #7f8c8d;
      font-size: 0.95rem;
    }
    .quote-box {
      background: #f8fafc;
      border-left: 4px solid #3498db;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-style: italic;
      color: #555;
    }
    .section-title {
      font-size: 1.2rem;
      color: #34495e;
      margin-bottom: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      text-decoration: none;
      color: #2c3e50;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: #3498db;
    }
    .card .icon {
      font-size: 2rem;
    }
    .card .name {
      font-weight: 600;
      font-size: 1rem;
    }
    /* 行事曆樣式 */
    .calendar-section {
      background: #f8fafc;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e2e8f0;
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .calendar-header h2 {
      font-size: 1.3rem;
      color: #2c3e50;
      font-weight: 600;
    }
    .cal-nav-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 600;
      color: #475569;
      transition: all 0.2s;
    }
    .cal-nav-btn:hover {
      background: #3498db;
      color: white;
      border-color: #3498db;
    }
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .cal-day {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      font-size: 0.95rem;
      font-weight: 500;
      color: #334155;
      transition: all 0.2s;
      cursor: pointer;
    }
    .cal-day:hover {
      background: #e0f2fe;
      border-color: #38bdf8;
    }
    .cal-day.empty {
      background: transparent;
      border: none;
      cursor: default;
    }
    .cal-day.today {
      background: #3498db;
      color: white;
      font-weight: 700;
      border-color: #2980b9;
      box-shadow: 0 4px 10px rgba(52, 152, 219, 0.35);
    }
    .schedule-memo {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #64748b;
      font-size: 0.9rem;
    }
    .schedule-memo .badge {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="panel-container">
    <div class="header">
      <h1>✨ My Panel 生活儀表板</h1>
      <div class="clock" id="clock">00:00:00</div>
      <div class="date-str" id="date-str">載入中...</div>
    </div>

    <div class="quote-box" id="quote">
      💡 「每一次微小的進步，都是未來巨大成就的基石。」
    </div>

    <div class="section-title">📌 常用快速連結</div>
    <div class="grid">
      <a href="https://elearn4.ndhu.edu.tw/" target="_blank" class="card">
        <span class="icon">🎓</span>
        <span class="name">東華 eLearn</span>
      </a>
      <a href="https://github.com/" target="_blank" class="card">
        <span class="icon">🐙</span>
        <span class="name">GitHub</span>
      </a>
      <a href="https://chatgpt.com/" target="_blank" class="card">
        <span class="icon">🤖</span>
        <span class="name">ChatGPT</span>
      </a>
      <a href="https://www.google.com/" target="_blank" class="card">
        <span class="icon">🔍</span>
        <span class="name">Google</span>
      </a>
    </div>

    <div class="section-title">📅 月曆與行事曆</div>
    <div class="calendar-section">
      <div class="calendar-header">
        <button class="cal-nav-btn" onclick="prevMonth()">‹ 上個月</button>
        <h2 id="calendar-month-year">2026 年 10 月</h2>
        <button class="cal-nav-btn" onclick="nextMonth()">下個月 ›</button>
      </div>
      <div class="calendar-weekdays">
        <div>日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div>六</div>
      </div>
      <div class="calendar-days" id="calendar-days"></div>
      <div class="schedule-memo">
        <span>📍 點擊面板快速掌握日程規劃</span>
        <span class="badge" id="selected-info">今日：2026/10/04</span>
      </div>
    </div>

    <footer>
      Powered by GitHub Pages | 創意生活應用
    </footer>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      document.getElementById('date-str').textContent = now.toLocaleDateString('zh-TW', options);
    }
    setInterval(updateTime, 1000);
    updateTime();

    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('calendar-month-year').textContent = `${year} 年 ${month + 1} 月`;

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();

      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'cal-day empty';
        daysContainer.appendChild(emptyDiv);
      }

      const today = new Date();

      for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day';
        dayDiv.textContent = day;

        if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
          dayDiv.classList.add('today');
        }

        dayDiv.onclick = () => {
          document.getElementById('selected-info').textContent = `已選擇：${year}/${month + 1}/${day}`;
        };

        daysContainer.appendChild(dayDiv);
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
